name: Deploy Comm

# Déploiement du composant Communication en mode « build sur le serveur ».
# 1. rsync des sources du monorepo vers le VPS (via la clé SSH de déploiement)
# 2. sur le VPS : docker compose up -d --build  (l'image est construite là-bas)
# 3. health check post-déploiement
#
# INACTIF par conception tant que VPS_HOST / VPS_USER / VPS_SSH_KEY sont absents :
# le job se déclenche mais le `gate` court-circuite tout (aucun échec, aucun accès réseau).
# Aucun registre externe, aucun token GHCR : la clé SSH suffit.

on:
  push:
    branches: [main]
    paths:
      - "apps/comm/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/deploy-comm.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-comm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - id: gate
        name: Vérifie la présence des secrets VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets VPS absents — déploiement ignoré (voulu, VPS non branché)."
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Prépare la clé SSH
        if: steps.gate.outputs.enabled == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync des sources vers le VPS
        if: steps.gate.outputs.enabled == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='apps/comm/.env' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            ./ "${VPS_USER}@${VPS_HOST}:~/agoum7/"

      - name: Build + up + health check sur le VPS
        if: steps.gate.outputs.enabled == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            "${VPS_USER}@${VPS_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/agoum7/apps/comm
          [ -f .env ] || printf 'PORT=3000\n' > .env   # défaut si absent
          docker compose up -d --build
          for i in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:3000/health | grep -q '"status":"ok"'; then
              echo "Health check OK"; exit 0
            fi
            echo "…tentative $i, service pas encore prêt"; sleep 3
          done
          echo "Health check KO — logs :"; docker compose logs --tail=50; exit 1
          REMOTE
