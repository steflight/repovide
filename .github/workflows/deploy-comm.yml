name: Deploy Comm

# Pipeline de déploiement du composant Communication.
#
# Deux étages :
#   1. build-and-push  — construit l'image et la publie sur GHCR (ghcr.io/<owner>/agoum7-comm).
#                        Actif : c'est la moitié testable du pipeline (aucun VPS requis).
#   2. deploy          — se connecte au VPS en SSH et redéploie l'image.
#                        INACTIF par conception (job court-circuité) tant que les secrets
#                        VPS_HOST / VPS_USER / VPS_SSH_KEY ne sont pas renseignés (Lot 2).
#                        GHCR_PULL_TOKEN sert au `docker login` côté VPS pour puller l'image.

on:
  push:
    branches: [main]
    paths:
      - "apps/comm/**"
      - "packages/**"
      - ".github/workflows/deploy-comm.yml"
  workflow_dispatch: {}   # déclenchement manuel (onglet Actions) pour tester à la demande

concurrency:
  group: deploy-comm
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Nom d'image (GHCR exige un owner en minuscules)
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agoum7-comm" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/comm/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - id: gate
        name: Vérifie la présence des secrets VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets VPS absents — déploiement SSH ignoré (voulu, Lot 2 non branché)."
          fi

      - name: Déploiement SSH sur le VPS + health check
        if: steps.gate.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ~/agoum7/apps/comm
            docker compose pull
            docker compose up -d
            docker logout ghcr.io || true
            # Health check post-déploiement (le service publie sur 127.0.0.1:3000)
            for i in $(seq 1 10); do
              if curl -fsS http://127.0.0.1:3000/health | grep -q '"status":"ok"'; then
                echo "Health check OK"; exit 0
              fi
              echo "…tentative $i, service pas encore prêt"; sleep 3
            done
            echo "Health check KO après déploiement — logs :"
            docker compose logs --tail=50
            exit 1
