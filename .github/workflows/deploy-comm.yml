name: Deploy Comm

# Déploiement du composant Communication vers le VPS.
# INACTIF par conception tant que les secrets ne sont pas renseignés (Lot 2) :
# VPS_HOST, VPS_USER, VPS_SSH_KEY, GHCR_PULL_TOKEN.
# Le job `gate` court-circuite tout tant que ces secrets sont absents :
# le workflow se déclenche mais ne construit ni ne déploie rien (aucun échec).

on:
  push:
    branches: [main]
    paths:
      - "apps/comm/**"
      - "packages/**"

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Secrets VPS absents — déploiement ignoré (voulu, Lot 2)."
          fi

  build-and-push:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/comm/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/agoum7-comm:latest

  deploy:
    needs: [gate, build-and-push]
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement SSH sur le VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ~/agoum7/apps/comm
            docker compose pull
            docker compose up -d
