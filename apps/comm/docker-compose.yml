services:
  comm:
    # Image publiée par le pipeline (.github/workflows/deploy-comm.yml).
    # IMAGE_TAG permet d'épingler un SHA précis pour un rollback ; défaut = latest.
    image: ghcr.io/steflight/agoum7-comm:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"   # local only ; Traefik/Caddy route + HTTPS (Lot 2)
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
